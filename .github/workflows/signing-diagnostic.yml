name: Diagnose 1.0.1 to 1.0.2 APK compatibility

on:
  push:
    paths:
      - .github/workflows/signing-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download original 1.0.1 GitHub APK (run 67)
        uses: actions/download-artifact@v4
        with:
          run-id: 38034218829
          github-token: ${{ github.token }}
          name: Pitchcraft-debug-apk
          path: old
      - name: Download latest successful 1.0.2 test APK
        uses: actions/download-artifact@v4
        with:
          run-id: 38042317044
          github-token: ${{ github.token }}
          name: Pitchcraft-TEST-ONLY-not-an-update-APK
          path: new
      - name: Verify exact versions and certificate fingerprints (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path

          sdk = Path(os.environ.get("ANDROID_HOME", "/usr/local/lib/android/sdk"))
          tools = sorted((sdk / "build-tools").glob("*/apksigner"))
          aapts = sorted((sdk / "build-tools").glob("*/aapt"))
          if not tools or not aapts:
              raise SystemExit("Android build tools missing")
          signer, aapt = str(tools[-1]), str(aapts[-1])
          def inspect(where, expected_version_code, expected_version_name):
              matches = list(Path(where).rglob("*.apk"))
              if len(matches) != 1:
                  raise SystemExit("Expected exactly one APK under " + where)
              apk = matches[0]
              subprocess.run([signer, "verify", str(apk)], check=True)
              badging = subprocess.check_output([aapt, "dump", "badging", str(apk)], text=True).splitlines()[0]
              print(badging, flush=True)
              required = (f"name='com.anshdeep.pitchcraft.debug'", f"versionCode='{expected_version_code}'", f"versionName='{expected_version_name}'")
              if any(s not in badging for s in required):
                  raise SystemExit(f"Wrong package/version metadata in {apk}")
              detail = subprocess.check_output([signer, "verify", "--print-certs", str(apk)], text=True)
              print(f"Raw public certificate detail for {apk}:\n{detail}", flush=True)
              m = re.search(r"certificate\s+SHA-256\s+digest:\s*([0-9a-fA-F]{64})",detail,re.I)
              if not m:
                  raise SystemExit("Could not read valid SHA-256 certificate fingerprint; no compatibility verdict")
              cert = m.group(1).lower()
              print(f"Parsed {apk} signer SHA-256: {cert}",flush=True)
              return cert

          old = inspect("old",2,"1.0.1")
          new = inspect("new",3,"1.0.2")
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          if old == new:
              verdict = "MATCH - these two specific GitHub APK artifacts use the same signing certificate"
              print("RESULT: MATCHING_CERTIFICATES",flush=True)
          else:
              verdict = "MISMATCH - these two specific GitHub APK artifacts cannot update each other in place"
              print("RESULT: DIFFERENT_CERTIFICATES",flush=True)
          with open(summary,"a") as f:
              f.write(f"## Pitchcraft 1.0.1 vs 1.0.2\n\n- Old cert SHA-256: \`{old}\`\n- New cert SHA-256: \`{new}\`\n- **{verdict}**\n\nThe phone's installed APK certificate must still be checked. Do not uninstall or clear app data.\n")
          PY

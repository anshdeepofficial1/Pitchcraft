name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: pitchcraft-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK 36
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Bundle verified MobileFaceNet model
        run: |
          mkdir -p app/src/main/assets/models
          curl -fL --retry 3 --connect-timeout 20 \
            https://models.ente.com/mobilefacenet_portable_static_b1.onnx \
            -o app/src/main/assets/models/mobilefacenet_portable_static_b1.onnx
          echo "0763fc33f54e138476194da95987e133b3e976075a6b1d3e1b2caedb251b1a36  app/src/main/assets/models/mobilefacenet_portable_static_b1.onnx" | sha256sum -c -

      - name: Enforce People database safety and package contract
        run: |
          if grep -R -nE '\\.fallbackToDestructiveMigration' app/src/main/java/com/inferno/gallery/data/db; then
            echo "::error::Destructive Room migration fallback is forbidden: would erase People indexing."
            exit 1
          fi
          grep -q 'applicationIdSuffix = ".debug"' app/build.gradle.kts
          grep -q 'versionCode = 3' app/build.gradle.kts
          grep -q 'minSdk = 26' app/build.gradle.kts
      - name: Build universal debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Verify test-only debug APK ID and version
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          META="$("$SDKROOT/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 1)"
          echo "$META"
          echo "$META" | grep -q "package: name='com.anshdeep.pitchcraft.debug'"
          echo "$META" | grep -q "versionCode='3'"

      - name: Verify install-ready APK archive, signature, SDK range and included ABIs
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          unzip -t "$APK" >/dev/null
          "$SDKROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$SDKROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)"
          "$SDKROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "sdkVersion:'26'"
          NATIVE="$("$SDKROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep '^native-code:')"
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            echo "$NATIVE" | grep -q "'$ABI'" || { echo "::error::Missing native ABI: $ABI"; exit 1; }
          done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fresh APK install and startup on Android 11 (API 30)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/emulator-smoke.sh

      - name: Fresh APK install and startup on Android 15 (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/emulator-smoke.sh

      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pitchcraft-runtime-log
          path: pitchcraft-logcat.txt
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          # Every CI runner has a fresh debug key: this artifact is NOT an update.
          name: Pitchcraft-TEST-ONLY-not-an-update-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: pitchcraft-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK 36
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Bundle verified MobileFaceNet model
        run: |
          mkdir -p app/src/main/assets/models
          curl -fL --retry 3 --connect-timeout 20 \
            https://models.ente.com/mobilefacenet_portable_static_b1.onnx \
            -o app/src/main/assets/models/mobilefacenet_portable_static_b1.onnx
          echo "0763fc33f54e138476194da95987e133b3e976075a6b1d3e1b2caedb251b1a36  app/src/main/assets/models/mobilefacenet_portable_static_b1.onnx" | sha256sum -c -

      - name: Build universal debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Runtime smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            APK="app/build/outputs/apk/debug/app-debug.apk"
            test -f "$APK"
            adb logcat -c
            adb install -r "$APK"
            adb shell am force-stop com.anshdeep.pitchcraft.debug || true
            adb shell am start -W -n com.anshdeep.pitchcraft.debug/com.inferno.gallery.MainActivity
            sleep 12
            PID="$(adb shell pidof com.anshdeep.pitchcraft.debug | tr -d '\r')"
            if [ -z "$PID" ]; then
              echo "Pitchcraft process is not alive after launch."
              adb logcat -d -t 1000
              exit 1
            fi
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" || true
            adb logcat -d -t 1500 > pitchcraft-logcat.txt
            if grep -E "FATAL EXCEPTION|Process: com\.anshdeep\.pitchcraft\.debug|AndroidRuntime:.*FATAL" pitchcraft-logcat.txt; then
              echo "Fatal runtime crash detected."
              cat pitchcraft-logcat.txt
              exit 1
            fi
            echo "Runtime smoke test passed. PID=$PID"

      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pitchcraft-runtime-log
          path: pitchcraft-logcat.txt
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pitchcraft-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

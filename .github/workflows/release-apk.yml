name: Pitchcraft 1.0.2 In-Place Upgrade (Original Signing Key)

on:
  workflow_dispatch:
    inputs:
      installed_package:
        description: 'Exact package installed on your phone (check with adb shell pm list packages)'
        required: true
        type: choice
        options:
          - com.anshdeep.pitchcraft.debug
          - com.anshdeep.pitchcraft
      original_cert_sha256:
        description: 'SHA-256 certificate fingerprint from the INSTALLED 1.0.1 APK (64 hex characters)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPECTED_PACKAGE: ${{ inputs.installed_package }}
      EXPECTED_CERT_SHA256: ${{ inputs.original_cert_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK 36
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Check expected old signing fingerprint
        run: |
          python3 - <<'PY'
          import os, re
          cert = os.environ["EXPECTED_CERT_SHA256"].replace(":", "").strip()
          if not re.fullmatch(r"[0-9a-fA-F]{64}", cert):
              raise SystemExit("Supply the SHA-256 certificate fingerprint of the INSTALLED v1.0.1 APK.")
          PY
      - name: Restore the exact v1.0.1 signing key (secrets only)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.PITCHCRAFT_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.PITCHCRAFT_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.PITCHCRAFT_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.PITCHCRAFT_KEY_PASSWORD }}
        run: |
          for key in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required signing secret: $key. Do not use a newly generated key."
              exit 1
            fi
          done
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pitchcraft-original.jks"
          test -s "$RUNNER_TEMP/pitchcraft-original.jks"
          echo "PITCHCRAFT_KEYSTORE_PATH=$RUNNER_TEMP/pitchcraft-original.jks" >> "$GITHUB_ENV"
      - name: Configure original signing key securely
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.PITCHCRAFT_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.PITCHCRAFT_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.PITCHCRAFT_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          # Java .properties syntax requires escaping backslashes, separators and newlines.
          def prop(value):
              return value.replace("\\", "\\\\").replace("\n", "\\n").replace("\r", "\\r").replace("=", "\\=").replace(":", "\\:")
          values = {
              "storeFile": os.environ["PITCHCRAFT_KEYSTORE_PATH"],
              "storePassword": os.environ["SIGNING_STORE_PASSWORD"],
              "keyAlias": os.environ["SIGNING_KEY_ALIAS"],
              "keyPassword": os.environ["SIGNING_KEY_PASSWORD"],
          }
          Path("key.properties").write_text("".join(f"{key}={prop(value)}\n" for key, value in values.items()))
          PY
      - name: Bundle verified offline MobileFaceNet model
        run: |
          mkdir -p app/src/main/assets/models
          curl -fL --retry 3 --connect-timeout 20 \
            https://models.ente.com/mobilefacenet_portable_static_b1.onnx \
            -o app/src/main/assets/models/mobilefacenet_portable_static_b1.onnx
          echo "0763fc33f54e138476194da95987e133b3e976075a6b1d3e1b2caedb251b1a36  app/src/main/assets/models/mobilefacenet_portable_static_b1.onnx" | sha256sum -c -
      - name: Build exactly one original-key-signed APK
        run: |
          chmod +x ./gradlew
          if [ "$EXPECTED_PACKAGE" = "com.anshdeep.pitchcraft.debug" ]; then
            ./gradlew :app:assembleDebug -PpitchcraftUpgradeSigning=true --stacktrace
            echo "OUTPUT_APK=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          elif [ "$EXPECTED_PACKAGE" = "com.anshdeep.pitchcraft" ]; then
            ./gradlew :app:assembleRelease --stacktrace
            echo "OUTPUT_APK=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "::error::Unsupported installed application ID."
            exit 1
          fi
      - name: Reject mismatched package, version, APK signature or signer
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          from pathlib import Path
          apk = Path(os.environ["OUTPUT_APK"])
          if not apk.is_file():
              sys.exit(f"Expected single APK missing: {apk}")
          sdk = Path(os.environ.get("ANDROID_HOME", "/usr/local/lib/android/sdk")) / "build-tools" / "36.0.0"
          subprocess.run([str(sdk / "apksigner"), "verify", "--verbose", str(apk)], check=True)
          badging = subprocess.check_output([str(sdk / "aapt"), "dump", "badging", str(apk)], text=True).splitlines()[0]
          actual_package = re.search(r"package: name='([^']+)'", badging)
          version_code = re.search(r"versionCode='([^']+)'", badging)
          version_name = re.search(r"versionName='([^']+)'", badging)
          if not actual_package or actual_package.group(1) != os.environ["EXPECTED_PACKAGE"]:
              sys.exit("Wrong APK package: refusing to upload (would not update installed app).")
          if not version_code or version_code.group(1) != "3" or not version_name or version_name.group(1) != "1.0.2":
              sys.exit("Wrong APK version: refusing to upload.")
          signer = subprocess.check_output([str(sdk / "apksigner"), "verify", "--print-certs", str(apk)], text=True)
          found = re.search(r"Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F]{64})", signer)
          actual = found.group(1).lower() if found else ""
          expected = os.environ["EXPECTED_CERT_SHA256"].lower().replace(":", "").strip()
          if not actual or actual != expected:
              sys.exit("SIGNING CERTIFICATE MISMATCH with 1.0.1: refusing to upload unsafe APK.")
          print("Verified original signing certificate, exact installed package and upgrade version.")
          PY
      - name: Upload single verified in-place upgrade APK
        uses: actions/upload-artifact@v4
        with:
          name: Pitchcraft-1.0.2-verified-inplace-upgrade
          path: ${{ env.OUTPUT_APK }}
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary key material
        if: always()
        run: |
          rm -f key.properties "$RUNNER_TEMP/pitchcraft-original.jks"

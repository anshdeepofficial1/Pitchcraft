name: Pitchcraft Upgrade-Compatible Release APK

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK 36
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Verify original release signing inputs are available
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.PITCHCRAFT_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.PITCHCRAFT_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.PITCHCRAFT_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.PITCHCRAFT_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "::error::Missing original 1.0.1 signing keystore secret."; exit 1; }
          test -n "$SIGNING_STORE_PASSWORD" || { echo "::error::Missing store password."; exit 1; }
          test -n "$SIGNING_KEY_ALIAS" || { echo "::error::Missing key alias."; exit 1; }
          test -n "$SIGNING_KEY_PASSWORD" || { echo "::error::Missing key password."; exit 1; }
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pitchcraft-release.jks"
          echo "PITCHCRAFT_KEYSTORE_PATH=$RUNNER_TEMP/pitchcraft-release.jks" >> "$GITHUB_ENV"
      - name: Configure release signing
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.PITCHCRAFT_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.PITCHCRAFT_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.PITCHCRAFT_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          vals = {
              "storeFile": os.environ["PITCHCRAFT_KEYSTORE_PATH"],
              "storePassword": os.environ["SIGNING_STORE_PASSWORD"],
              "keyAlias": os.environ["SIGNING_KEY_ALIAS"],
              "keyPassword": os.environ["SIGNING_KEY_PASSWORD"],
          }
          Path("key.properties").write_text("".join(f"{key}={value}\n" for key, value in vals.items()))
          PY
      - name: Bundle verified offline face model
        run: |
          mkdir -p app/src/main/assets/models
          curl -fL --retry 3 --connect-timeout 20 \
            https://models.ente.com/mobilefacenet_portable_static_b1.onnx \
            -o app/src/main/assets/models/mobilefacenet_portable_static_b1.onnx
          echo "0763fc33f54e138476194da95987e133b3e976075a6b1d3e1b2caedb251b1a36  app/src/main/assets/models/mobilefacenet_portable_static_b1.onnx" | sha256sum -c -
      - name: Build signed release
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace
      - name: Validate release package, version and signing
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT="$SDKROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$SDKROOT/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          META="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$META"
          echo "$META" | grep -q "package: name='com.anshdeep.pitchcraft'"
          echo "$META" | grep -q "versionCode='3'"
          echo "$META" | grep -q "versionName='1.0.2'"
      - name: Upload upgrade-compatible candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: Pitchcraft-1.0.2-signed-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Clean signing material
        if: always()
        run: |
          rm -f key.properties "$RUNNER_TEMP/pitchcraft-release.jks"

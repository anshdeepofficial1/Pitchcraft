name: Android 16 ARM64-only APK (diagnostic fresh install)

on:
  push:
    branches: [ main ]
    paths:
      - app/build.gradle.kts
      - gradle/libs.versions.toml
      - .github/workflows/android-arm64.yml
      - .github/scripts/check-native-16kb.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK 36
        run: |
          set -e
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Download known good local People face model
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          curl -fL --retry 3 --connect-timeout 20 \
            https://models.ente.com/mobilefacenet_portable_static_b1.onnx \
            -o app/src/main/assets/models/mobilefacenet_portable_static_b1.onnx
          echo "0763fc33f54e138476194da95987e133b3e976075a6b1d3e1b2caedb251b1a36  app/src/main/assets/models/mobilefacenet_portable_static_b1.onnx" | sha256sum -c -
      - name: Build ARM64-only Android 16-ready diagnostic APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug -PpitchcraftArm64Only=true --stacktrace
      - name: Validate actual ARM64 APK installability and native alignment
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD="$SDKROOT/build-tools/36.0.0"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$BUILD/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          python3 .github/scripts/check-native-16kb.py "$APK"
          META="$("$BUILD/aapt" dump badging "$APK")"
          printf '%s\n' "$META" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)"
          printf '%s\n' "$META" | grep -q "package: name='com.anshdeep.pitchcraft.debug' versionCode='3'"
          printf '%s\n' "$META" | grep -q "^native-code: 'arm64-v8a'$"
          python3 - "$APK" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              abis={x.filename.split("/")[1] for x in z.infolist() if x.filename.startswith("lib/") and x.filename.endswith(".so")}
              print("ABIs:",abis)
              if abis != {"arm64-v8a"}:
                  raise SystemExit("Wrong native ABI packaging")
              print("Package native libraries:",sum(x.filename.endswith(".so") for x in z.infolist()))
          PY
      - name: Upload ARM64 APK, direct APK inside ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Pitchcraft-1.0.2-Android16-ARM64-FRESH-TEST-ONLY
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

name: Actual 16 KiB Page Emulator Fresh Install

on:
  push:
    paths:
      - .github/workflows/android-16kb-emulator.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download 16KiB ELF-compatible universal APK (run 38045769452)
        uses: actions/download-artifact@v4
        with:
          run-id: 38045769452
          github-token: ${{ github.token }}
          name: Pitchcraft-TEST-ONLY-not-an-update-APK
          path: app/build/outputs/apk/debug
      - name: Make sure APK exists and KVM is accessible
        run: |
          set -e
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test truly 16KiB-page Android emulator install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash .github/scripts/emulator-16kb-smoke.sh
